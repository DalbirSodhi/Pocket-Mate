name: CI

on:
  pull_request:
    branches:
      - Development
      - main
  push:
    branches:
      - Development
      - main
      - "feature/**"
      - "chore/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-checks:
    name: Database security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Lint database schema
        run: supabase db lint --local --level warning

      - name: Test database policies and functions
        shell: bash
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee database-test-output.txt

      - name: Report database test failure
        if: failure()
        shell: bash
        run: |
          message="$(tail -c 12000 database-test-output.txt)"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          echo "::error file=supabase/tests/database,title=Database tests failed::$message"

      - name: Publish database test output
        if: always()
        shell: bash
        run: |
          echo "## Database test output" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat database-test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  project-checks:
    name: Project checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate documentation files
        run: |
          test -d docs
          find docs -name "*.md" -type f -print -exec test -s {} \;
          test -d apps/mobile
          test -d supabase/migrations
          test -d supabase/functions
          test -d packages/shared

      - name: Detect JavaScript project
        id: js_project
        shell: bash
        run: |
          if [ -f apps/mobile/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.js_project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        if: steps.js_project.outputs.exists == 'true'
        working-directory: apps/mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint
        if: steps.js_project.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm run lint --if-present

      - name: Run tests
        if: steps.js_project.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm test --if-present

      - name: Audit production dependencies
        if: steps.js_project.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm run audit:production

      - name: Validate release configuration
        if: steps.js_project.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npm run release:check

      - name: Validate Expo dependencies
        if: steps.js_project.outputs.exists == 'true'
        working-directory: apps/mobile
        run: npx expo-doctor
